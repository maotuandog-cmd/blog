# EXAMPLE ONLY — Hermes does not run Alertmanager.
# Scrape worker-core metrics (default :8081) for journey/vitals/jobs_finished.
# Gateway :8080/metrics still has enqueue / HMAC / reclaim counters.
#
# Related metrics (worker-core /metrics):
#   hermes_browser_journey_finished_total{protocol,success,app}
#   hermes_browser_vitals_lcp_milliseconds_bucket{protocol,app}
#   hermes_browser_vitals_ttfb_milliseconds_bucket{protocol,app}
#   hermes_browser_vitals_fcp_milliseconds_bucket{protocol,app}

groups:
  - name: hermes-browser-examples
    rules:
      - alert: HermesBrowserJourneySuccessLow
        expr: |
          sum by (app) (rate(hermes_browser_journey_finished_total{success="true"}[5m]))
          /
          sum by (app) (rate(hermes_browser_journey_finished_total[5m]))
          < 0.95
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Hermes browser journey success rate < 95% (app={{ $labels.app }})"

      - alert: HermesBrowserLCPP95High
        expr: |
          histogram_quantile(
            0.95,
            sum by (app, le) (rate(hermes_browser_vitals_lcp_milliseconds_bucket[10m]))
          ) > 2500
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Hermes browser LCP P95 > 2500ms (app={{ $labels.app }})"
