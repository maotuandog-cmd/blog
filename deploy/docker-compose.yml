services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Optional: Playwright Trace / artifact store (F-BRW-10)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hermes
      MINIO_ROOT_PASSWORD: hermessecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Create bucket once (optional helper)
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      mc alias set local http://minio:9000 hermes hermessecret;
      mc mb -p local/hermes-traces || true;
      exit 0;
      "

volumes:
  minio_data:
